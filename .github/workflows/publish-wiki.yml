# Publishes docs/wiki to this repository's GitHub wiki.
#
# The repository is push-mirrored from Gitea (gitea.uk.local), whose own wiki is published with
# docs/publish-wiki.sh. GitHub wikis only display the `master` branch, so this workflow copies the
# pages into `master` and rewrites links that point at the LAN-only Gitea instance.
name: Publish wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write   # lets GITHUB_TOKEN push to <repo>.wiki.git

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    # Gitea Actions also reads .github/workflows; only run on GitHub.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Copy pages and rewrite Gitea links
        env:
          GITEA_URL: https://gitea.uk.local:3001/Apps/minecraft-server-management
        run: |
          set -euo pipefail
          github_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          cd wiki
          git rm -rq --ignore-unmatch .
          cp -R ../docs/wiki/. .

          # Most specific patterns first. The Word guide is linked from the main repository instead
          # of being copied into the wiki.
          find . -name '*.md' -print0 | xargs -0 sed -i \
            -e "s#](raw/Minecraft-Server-Manager-User-Guide.docx)#](${github_url}/raw/main/docs/Minecraft-Server-Manager-User-Guide.docx)#g" \
            -e "s#${GITEA_URL}\.git#${github_url}.git#g" \
            -e "s#${GITEA_URL}/wiki#${github_url}/wiki#g" \
            -e "s#${GITEA_URL}#${github_url}#g" \
            -e "s#\[Apps/minecraft-server-management\]#[${GITHUB_REPOSITORY}]#g"

          printf '\n*This wiki is generated from [`docs/wiki`](%s/tree/main/docs/wiki); edits made here are overwritten.*\n' "${github_url}" >> _Footer.md

      - name: Commit and push
        run: |
          set -euo pipefail
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git commit -m "Publish wiki from ${GITHUB_SHA::7}"
          git push origin HEAD:master
